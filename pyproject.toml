[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rice_atlas"
version = "0.0.1"
description = "A Napari plugin for rice organ atlas construction"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "pandas",
    "tqdm",
    "napari",
    "qtpy",
    "magicgui",
    "vedo",
    "requests",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-cov",
]

[project.entry-points."napari.manifest"]
rice_atlas = "rice_atlas:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/rice_atlas"]
